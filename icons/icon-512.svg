<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer concentric glowing rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" />

  <!-- Smart Plug Central Circle -->
  <circle cx="256" cy="256" r="100" fill="#FFFFFF" filter="url(#glow)" />
  
  <!-- Plug Prongs / Design in Center -->
  <rect x="220" y="215" width="16" height="42" rx="8" fill="#4F46E5" />
  <rect x="276" y="215" width="16" height="42" rx="8" fill="#4F46E5" />
  <circle cx="256" cy="290" r="10" fill="#6366F1" />
  
  <!-- Power indicator LED glowing emerald -->
  <circle cx="256" cy="190" r="9" fill="#10B981" />
  
  <!-- Bottom Connected Status Pill -->
  <rect x="186" y="380" width="140" height="36" rx="18" fill="#10B981" />
  <circle cx="206" cy="398" r="6" fill="#FFFFFF" />
  <text x="222" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="1">ONLINE</text>
</svg>
