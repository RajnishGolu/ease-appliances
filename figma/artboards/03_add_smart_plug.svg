<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="primaryGlowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="splashGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAFAFA" />
    </linearGradient>
    <linearGradient id="offSwitchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    
    <!-- Filters / Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.02" />
    </filter>
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6366F1" flood-opacity="0.25" />
    </filter>
    <filter id="powerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#6366F1" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="390" height="844" fill="url(#bgGrad)" />
  
    <!-- Status Bar -->
    <g id="Status_Bar">
      <text x="36" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#0F172A" letter-spacing="-0.3">9:41</text>
      <!-- Cellular -->
      <g transform="translate(294, 23)" fill="#0F172A">
        <rect x="0" y="8" width="3" height="4" rx="0.8"/>
        <rect x="4.5" y="6" width="3" height="6" rx="0.8"/>
        <rect x="9" y="3" width="3" height="9" rx="0.8"/>
        <rect x="13.5" y="0" width="3" height="12" rx="0.8"/>
      </g>
      <!-- Wi-Fi -->
      <g transform="translate(318, 23)" fill="#0F172A">
        <path d="M7.5 2.5C4.5 2.5 1.8 3.8 0 5.8L7.5 14L15 5.8C13.2 3.8 10.5 2.5 7.5 2.5ZM7.5 4.8C9.7 4.8 11.7 5.7 13.1 7.2L7.5 13.3L1.9 7.2C3.3 5.7 5.3 4.8 7.5 4.8Z"/>
      </g>
      <!-- Battery -->
      <g transform="translate(340, 23)">
        <rect x="0" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="#0F172A" stroke-width="1"/>
        <rect x="2" y="2.5" width="14" height="7" rx="2" fill="#0F172A"/>
        <path d="M23 4C23.5 4.5 23.5 7.5 23 8" stroke="#0F172A" stroke-width="1" stroke-linecap="round"/>
      </g>
    </g>
    
  
    <!-- Back Button -->
    <g id="Btn_Back" cursor="pointer">
      <circle cx="44" cy="74" r="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <path d="M47 68L41 74L47 80" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    

  <!-- Header Step -->
  <text x="195" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1">STEP 1 OF 3</text>

  <!-- Titles -->
  <g id="Titles" transform="translate(24, 120)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Add your Smart Plug</text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="400" fill="#64748B">Let's connect your Smart Plug to your home Wi-Fi.</text>
  </g>

  <!-- Illustration of Smart Plug -->
  <g id="Illustration" transform="translate(95, 230)">
    <!-- Soft Background Circle -->
    <circle cx="100" cy="100" r="100" fill="#EEF2FF" />
    <circle cx="100" cy="100" r="75" fill="#E0E7FF" opacity="0.6" />
    
    <!-- Smart Plug Body -->
    <rect x="45" y="45" width="110" height="110" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#cardShadow)" />
    
    <!-- Power LED -->
    <circle cx="100" cy="72" r="4" fill="#6366F1" />
    
    <!-- Sockets -->
    <rect x="76" y="92" width="8" height="18" rx="3" fill="#1E293B" />
    <rect x="116" y="92" width="8" height="18" rx="3" fill="#1E293B" />
    <circle cx="100" cy="122" r="5" fill="#94A3B8" />

    <!-- Plus Badge -->
    <g transform="translate(136, 136)">
      <circle cx="18" cy="18" r="18" fill="#6366F1" filter="url(#btnShadow)" />
      <path d="M18 11V25M11 18H25" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Guidance Steps -->
  <g id="Instructions" transform="translate(36, 500)">
    <g transform="translate(0, 0)">
      <circle cx="14" cy="14" r="14" fill="#EEF2FF" />
      <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#4F46E5" text-anchor="middle">1</text>
      <text x="40" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#334155">Plug device into any standard electrical wall socket</text>
    </g>
    <g transform="translate(0, 44)">
      <circle cx="14" cy="14" r="14" fill="#EEF2FF" />
      <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#4F46E5" text-anchor="middle">2</text>
      <text x="40" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#334155">Verify that the indicator light is slowly blinking</text>
    </g>
  </g>

  <!-- Action Buttons -->
  <g id="Actions" transform="translate(24, 700)">
    <!-- Primary Button: Start Setup -->
    <g id="Btn_Start_Setup" filter="url(#btnShadow)" cursor="pointer">
      <rect width="342" height="56" rx="20" fill="url(#primaryGrad)" />
      <text x="171" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Start Setup</text>
    </g>
    
    <!-- Secondary Button: Connect Existing -->
    <text x="171" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#6366F1" text-anchor="middle" cursor="pointer">Already configured? Connect existing plug</text>
  </g>

  
    <!-- Home Indicator -->
    <g id="Home_Indicator">
      <rect x="125" y="828" width="140" height="5" rx="2.5" fill="#94A3B8" opacity="0.5" />
    </g>
    
</svg>