<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="primaryGlowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="splashGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAFAFA" />
    </linearGradient>
    <linearGradient id="offSwitchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    
    <!-- Filters / Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.02" />
    </filter>
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6366F1" flood-opacity="0.25" />
    </filter>
    <filter id="powerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#6366F1" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="390" height="844" fill="url(#bgGrad)" />
  
    <!-- Status Bar -->
    <g id="Status_Bar">
      <text x="36" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#0F172A" letter-spacing="-0.3">9:41</text>
      <!-- Cellular -->
      <g transform="translate(294, 23)" fill="#0F172A">
        <rect x="0" y="8" width="3" height="4" rx="0.8"/>
        <rect x="4.5" y="6" width="3" height="6" rx="0.8"/>
        <rect x="9" y="3" width="3" height="9" rx="0.8"/>
        <rect x="13.5" y="0" width="3" height="12" rx="0.8"/>
      </g>
      <!-- Wi-Fi -->
      <g transform="translate(318, 23)" fill="#0F172A">
        <path d="M7.5 2.5C4.5 2.5 1.8 3.8 0 5.8L7.5 14L15 5.8C13.2 3.8 10.5 2.5 7.5 2.5ZM7.5 4.8C9.7 4.8 11.7 5.7 13.1 7.2L7.5 13.3L1.9 7.2C3.3 5.7 5.3 4.8 7.5 4.8Z"/>
      </g>
      <!-- Battery -->
      <g transform="translate(340, 23)">
        <rect x="0" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="#0F172A" stroke-width="1"/>
        <rect x="2" y="2.5" width="14" height="7" rx="2" fill="#0F172A"/>
        <path d="M23 4C23.5 4.5 23.5 7.5 23 8" stroke="#0F172A" stroke-width="1" stroke-linecap="round"/>
      </g>
    </g>
    

  <!-- Header -->
  <g id="Header" transform="translate(24, 60)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#6366F1" letter-spacing="0.8">GOOD EVENING</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="-0.5">My Smart Plugs</text>
    <!-- Avatar -->
    <g transform="translate(302, 4)">
      <circle cx="20" cy="20" r="20" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
      <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#4F46E5" text-anchor="middle">RM</text>
    </g>
  </g>

  <!-- Device Card: Living Room -->
  <g id="Device_Card" transform="translate(24, 136)" filter="url(#cardShadow)">
    <rect width="342" height="152" rx="24" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1" />
    
    <!-- Plug Icon Thumbnail -->
    <g transform="translate(20, 20)">
      <rect width="48" height="48" rx="16" fill="#EEF2FF" />
      <path d="M24 14V22M17 22V26C17 29.866 20.134 33 24 33C27.866 33 31 29.866 31 26V22M20 14V22M28 14V22M24 33V37" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Plug Info -->
    <g transform="translate(80, 22)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" fill="#0F172A">Living Room</text>
      <!-- Status Badge -->
      <g transform="translate(0, 26)">
        <rect width="84" height="22" rx="11" fill="#ECFDF5" />
        <circle cx="10" cy="11" r="3.5" fill="#10B981" />
        <text x="18" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#059669">Connected</text>
      </g>
      <!-- Wi-Fi Icon -->
      <g transform="translate(94, 28)" fill="#94A3B8">
        <path d="M6 2C3.6 2 1.4 3 0 4.6L6 11L12 4.6C10.6 3 8.4 2 6 2Z"/>
      </g>
    </g>

    <!-- Power Toggle Switch -->
    <g id="Toggle_Switch" transform="translate(262, 28)">
      <rect width="60" height="34" rx="17" fill="#6366F1" />
      <circle cx="43" cy="17" r="13" fill="#FFFFFF" filter="url(#cardShadow)" />
      <!-- Power Icon inside thumb -->
      <path d="M43 11V16M39.5 13.5C37.5 15.5 37.5 18.5 39.5 20.5C41.5 22.5 44.5 22.5 46.5 20.5C48.5 18.5 48.5 15.5 46.5 13.5" fill="none" stroke="#6366F1" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Divider -->
    <line x1="20" y1="104" x2="322" y2="104" stroke="#F1F5F9" stroke-width="1" />

    <!-- Card Footer -->
    <g transform="translate(20, 118)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#64748B">Current State: <tspan font-weight="700" fill="#4F46E5">ON</tspan></text>
      <text x="302" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="end">Updated just now</text>
    </g>
  </g>

  <!-- Ambient Card / Quick Tips -->
  <g id="Tip_Card" transform="translate(24, 308)">
    <rect width="342" height="88" rx="20" fill="#EEF2FF" stroke="#E0E7FF" stroke-width="1" />
    <g transform="translate(18, 18)">
      <rect width="36" height="36" rx="12" fill="#6366F1" />
      <path d="M18 10V12M18 24V26M26 18H24M12 18H10M23.6 12.4L22.2 13.8M13.8 22.2L12.4 23.6M23.6 23.6L22.2 22.2M13.8 13.8L12.4 12.4M21 18C21 19.657 19.657 21 18 21C16.343 21 15 19.657 15 18C15 16.343 16.343 15 18 15C19.657 15 21 16.343 21 18Z" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g transform="translate(68, 22)">
      <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">Tap card to inspect</text>
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400" fill="#4338CA">Open large circular power dial and Wi-Fi options.</text>
    </g>
  </g>

  <!-- Add Smart Plug Button -->
  <g id="Btn_Add_Smart_Plug" transform="translate(24, 740)" filter="url(#btnShadow)" cursor="pointer">
    <rect width="342" height="56" rx="20" fill="url(#primaryGrad)" />
    <!-- Plus Icon -->
    <path d="M152 28H190M171 19V37" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <text x="180" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Add Smart Plug</text>
  </g>

  
    <!-- Home Indicator -->
    <g id="Home_Indicator">
      <rect x="125" y="828" width="140" height="5" rx="2.5" fill="#94A3B8" opacity="0.5" />
    </g>
    
</svg>