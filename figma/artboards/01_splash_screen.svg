<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="primaryGlowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="splashGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAFAFA" />
    </linearGradient>
    <linearGradient id="offSwitchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    
    <!-- Filters / Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.02" />
    </filter>
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6366F1" flood-opacity="0.25" />
    </filter>
    <filter id="powerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#6366F1" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#splashGrad)" />
  
    <!-- Status Bar -->
    <g id="Status_Bar">
      <text x="36" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" letter-spacing="-0.3">9:41</text>
      <!-- Cellular -->
      <g transform="translate(294, 23)" fill="#FFFFFF">
        <rect x="0" y="8" width="3" height="4" rx="0.8"/>
        <rect x="4.5" y="6" width="3" height="6" rx="0.8"/>
        <rect x="9" y="3" width="3" height="9" rx="0.8"/>
        <rect x="13.5" y="0" width="3" height="12" rx="0.8"/>
      </g>
      <!-- Wi-Fi -->
      <g transform="translate(318, 23)" fill="#FFFFFF">
        <path d="M7.5 2.5C4.5 2.5 1.8 3.8 0 5.8L7.5 14L15 5.8C13.2 3.8 10.5 2.5 7.5 2.5ZM7.5 4.8C9.7 4.8 11.7 5.7 13.1 7.2L7.5 13.3L1.9 7.2C3.3 5.7 5.3 4.8 7.5 4.8Z"/>
      </g>
      <!-- Battery -->
      <g transform="translate(340, 23)">
        <rect x="0" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="1"/>
        <rect x="2" y="2.5" width="14" height="7" rx="2" fill="#FFFFFF"/>
        <path d="M23 4C23.5 4.5 23.5 7.5 23 8" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
      </g>
    </g>
    
  
  <!-- Content -->
  <g id="Content" transform="translate(0, 0)">
    <!-- Ambient Glow behind logo -->
    <circle cx="195" cy="380" r="110" fill="#6366F1" opacity="0.25" filter="url(#powerGlow)" />
    
    <!-- Logo Icon -->
    <g id="App_Logo" transform="translate(135, 320)">
      <rect width="120" height="120" rx="32" fill="url(#primaryGrad)" filter="url(#btnShadow)" stroke="#818CF8" stroke-width="1.5" />
      <!-- Power Icon inside Logo -->
      <path d="M60 36V60M44 45C38 52 38 65 45 74C52 82 68 82 75 74C82 65 82 52 76 45" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Typography -->
    <g id="Typography">
      <rect x="145" y="240" width="100" height="26" rx="13" fill="#6366F1" opacity="0.2" stroke="#818CF8" stroke-width="1" stroke-opacity="0.4"/>
      <text x="195" y="257" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#A5B4FC" text-anchor="middle" letter-spacing="1">SMART HOME</text>
      
      <text x="195" y="485" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">My Smart Plug</text>
      <text x="195" y="515" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="400" fill="#C7D2FE" text-anchor="middle">Control your home, from anywhere.</text>
    </g>

    <!-- Loading Indicator -->
    <g id="Loading_Dots" transform="translate(177, 720)">
      <circle cx="6" cy="6" r="4" fill="#818CF8" />
      <circle cx="18" cy="6" r="4" fill="#A5B4FC" opacity="0.8" />
      <circle cx="30" cy="6" r="4" fill="#C7D2FE" opacity="0.5" />
    </g>
    <text x="195" y="754" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#818CF8" text-anchor="middle">Auto-launching Home...</text>
  </g>
  
    <!-- Home Indicator -->
    <g id="Home_Indicator">
      <rect x="125" y="828" width="140" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4" />
    </g>
    
</svg>