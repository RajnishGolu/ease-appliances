<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="primaryGlowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="splashGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAFAFA" />
    </linearGradient>
    <linearGradient id="offSwitchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    
    <!-- Filters / Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.02" />
    </filter>
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6366F1" flood-opacity="0.25" />
    </filter>
    <filter id="powerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#6366F1" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="390" height="844" fill="url(#bgGrad)" />
  
    <!-- Status Bar -->
    <g id="Status_Bar">
      <text x="36" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#0F172A" letter-spacing="-0.3">9:41</text>
      <!-- Cellular -->
      <g transform="translate(294, 23)" fill="#0F172A">
        <rect x="0" y="8" width="3" height="4" rx="0.8"/>
        <rect x="4.5" y="6" width="3" height="6" rx="0.8"/>
        <rect x="9" y="3" width="3" height="9" rx="0.8"/>
        <rect x="13.5" y="0" width="3" height="12" rx="0.8"/>
      </g>
      <!-- Wi-Fi -->
      <g transform="translate(318, 23)" fill="#0F172A">
        <path d="M7.5 2.5C4.5 2.5 1.8 3.8 0 5.8L7.5 14L15 5.8C13.2 3.8 10.5 2.5 7.5 2.5ZM7.5 4.8C9.7 4.8 11.7 5.7 13.1 7.2L7.5 13.3L1.9 7.2C3.3 5.7 5.3 4.8 7.5 4.8Z"/>
      </g>
      <!-- Battery -->
      <g transform="translate(340, 23)">
        <rect x="0" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="#0F172A" stroke-width="1"/>
        <rect x="2" y="2.5" width="14" height="7" rx="2" fill="#0F172A"/>
        <path d="M23 4C23.5 4.5 23.5 7.5 23 8" stroke="#0F172A" stroke-width="1" stroke-linecap="round"/>
      </g>
    </g>
    

  <!-- Top Navigation -->
  <g id="Nav_Header">
    
    <!-- Back Button -->
    <g id="Btn_Back" cursor="pointer">
      <circle cx="44" cy="74" r="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <path d="M47 68L41 74L47 80" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <text x="195" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="middle">Living Room</text>
    <!-- Settings Button -->
    <g id="Btn_Settings" transform="translate(326, 54)" cursor="pointer">
      <circle cx="20" cy="20" r="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <path d="M20 16A4 4 0 1 0 20 24A4 4 0 1 0 20 16ZM20 12V14M20 26V28M12 20H14M26 20H28M14.3 14.3L15.7 15.7M24.3 24.3L25.7 25.7M14.3 25.7L15.7 24.3M24.3 15.7L25.7 14.3" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Status Pill -->
  <g transform="translate(145, 116)">
    <rect width="100" height="26" rx="13" fill="#ECFDF5" />
    <circle cx="14" cy="13" r="3.5" fill="#10B981" />
    <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#059669">Connected</text>
  </g>

  <!-- Large Circular Power Dial (ON State) -->
  <g id="Power_Dial_ON" transform="translate(195, 340)" cursor="pointer">
    <!-- Ambient Radial Halo -->
    <circle cx="0" cy="0" r="130" fill="#6366F1" opacity="0.15" filter="url(#powerGlow)" />
    <circle cx="0" cy="0" r="105" fill="#6366F1" opacity="0.3" filter="url(#powerGlow)" />
    
    <!-- Main Outer Ring -->
    <circle cx="0" cy="0" r="95" fill="url(#primaryGlowGrad)" stroke="#818CF8" stroke-width="3" filter="url(#powerGlow)" />
    
    <!-- Power Icon -->
    <g transform="translate(-24, -46)">
      <path d="M24 0V26M10 10C2 19 2 34 11 44C20 54 36 54 45 44C54 34 54 19 46 10" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <!-- State Labels -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ON</text>
    <text x="0" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#E0E7FF" text-anchor="middle">Power is on</text>
  </g>

  <text x="195" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Tap to switch power state</text>

  <!-- Info & Quick Actions Section -->
  <g id="Control_Cards" transform="translate(24, 530)">
    
    <!-- Device Info Card -->
    <g id="Info_Row" filter="url(#cardShadow)">
      <rect width="342" height="72" rx="20" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1" />
      <g transform="translate(18, 16)">
        <rect width="40" height="40" rx="12" fill="#EEF2FF" />
        <g transform="translate(10, 10)" fill="#4F46E5">
          <path d="M10 2C6 2 2.3 3.6 0 6.2L10 17L20 6.2C17.7 3.6 14 2 10 2Z"/>
        </g>
      </g>
      <text x="72" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A">Wi-Fi Connection</text>
      <text x="72" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="400" fill="#64748B">Strong (Home Wi-Fi)</text>
      <text x="322" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#6366F1" text-anchor="end" cursor="pointer">Change</text>
    </g>

    <!-- Quick Action Grid -->
    <g id="Action_Grid" transform="translate(0, 92)">
      <!-- Rename Tile -->
      <g id="Tile_Rename" cursor="pointer">
        <rect width="164" height="60" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <path d="M22 30H32M27 22L34 29" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
        <text x="50" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#334155">Rename</text>
      </g>
      <!-- Wi-Fi Settings Tile -->
      <g id="Tile_Wifi_Settings" transform="translate(178, 0)" cursor="pointer">
        <rect width="164" height="60" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <path d="M20 32C24 28 32 28 36 32" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
        <text x="50" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#334155">Wi-Fi</text>
      </g>
    </g>

    <!-- Toast Confirmation Example -->
    <g id="Toast_Pill" transform="translate(71, 180)">
      <rect width="200" height="38" rx="19" fill="#0F172A" opacity="0.9" />
      <circle cx="20" cy="19" r="6" fill="#10B981" />
      <path d="M17 19L19 21L23 17" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Power turned on</text>
    </g>
  </g>

  
    <!-- Home Indicator -->
    <g id="Home_Indicator">
      <rect x="125" y="828" width="140" height="5" rx="2.5" fill="#94A3B8" opacity="0.5" />
    </g>
    
</svg>